       Timeline: asset in/out 3.2s (introFromLeft/Right), overlay

      justify-content: center;
      animation: introOverlayFade 3.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;

   .intro-overlay.intro-hidden {

    /* Sesi ini sudah pernah lihat intro → jangan pernah render overlay-nya

    @keyframes introFromLeft {
  0%      { transform: translateX(-30px); opacity: 0; filter: blur(14px); }
  31.25%  { transform: translateX(0);      opacity: 1; filter: blur(0); }

<script>
  
    var introFinished = false;
    var dataFinished = false;
    function tryReveal() {
      if (introFinished && dataFinished) revealWrapChildren();
    }

    const introOverlay = document.getElementById('introOverlay');
    if (introOverlay) {
      introOverlay.addEventListener('animationend', (e) => {
        if (e.target !== introOverlay) return;
        introOverlay.classList.add('intro-hidden');
        document.documentElement.classList.remove('intro-lock');

        try {
          sessionStorage.setItem('dummyIntroPlayed', 'true');
        } catch (err) {
        }

        introFinished = true;
        tryReveal();
      });
    }

    function revealWrapChildren() {
      var items = document.querySelectorAll('.reveal-item');
      if (!items.length) return;

      items.forEach(function (el, i) {
        el.style.transitionDelay = (i * 90) + 'ms';
      });

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          items.forEach(function (el) {
            el.classList.add('revealed');
          });
        });
      });
    }

    if (document.documentElement.classList.contains('intro-skip')) {
      introFinished = true;
      tryReveal();
    }

    var SCROLL_KEY = 'dummyScrollY';
    var saveScrollY = function () {
      try { sessionStorage.setItem(SCROLL_KEY, String(window.scrollY)); } catch (err) {}
    };
    window.addEventListener('scroll', saveScrollY, { passive: true });
    window.addEventListener('pagehide', saveScrollY);
    window.addEventListener('beforeunload', saveScrollY);
  
var PREFERS_REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

(function(){
  if (PREFERS_REDUCED_MOTION) return;
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var isMobile = window.innerWidth < 768;
  var count = isMobile ? 14 : 28;
  var particles = [];
  var w, h;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var colors = ['#22e8ff','#3b6bff','#a259ff'];

  for(var i=0;i<count;i++){
    particles.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.8 + 0.6,
      vx: (Math.random()-0.5)*0.15,
      vy: (Math.random()-0.5)*0.15,
      c: colors[i % colors.length],
      a: Math.random()*0.5 + 0.2
    });
  }

  function tick(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < 0) p.x = w;
      if(p.x > w) p.x = 0;
      if(p.y < 0) p.y = h;
      if(p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.c;
      ctx.globalAlpha = p.a;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!document.hidden) requestAnimationFrame(tick);
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) requestAnimationFrame(tick);
  });
  tick();
})();

(function(){
  if (PREFERS_REDUCED_MOTION) return;
  var canvas = document.getElementById('shooting-star-canvas');
  var ctx = canvas.getContext('2d');
  var w, h;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var colors = [
    { star:'#9E00FF', trail:'#2EB9DF' },
    { star:'#FF0099', trail:'#FFB800' },
    { star:'#22e8ff', trail:'#3b6bff' }
  ];

  var stars = [];

  function spawnStar(){
    var side = Math.floor(Math.random()*4);
    var x, y, angle;
    var offset = Math.random()*w;

    if(side===0){ x=offset; y=-10; angle=45; }
    else if(side===1){ x=w+10; y=offset; angle=135; }
    else if(side===2){ x=offset; y=h+10; angle=225; }
    else { x=-10; y=offset; angle=315; }

    var c = colors[Math.floor(Math.random()*colors.length)];

    stars.push({
      x:x, y:y, angle:angle,
      speed: Math.random()*4 + 4,
      len: Math.random()*60 + 40,
      opacity:1,
      starColor:c.star,
      trailColor:c.trail
    });

    var delay = Math.random()*2500 + 1200;
    setTimeout(spawnStar, delay);
  }

  spawnStar();
  setTimeout(spawnStar, 900);

  function draw(){
    ctx.clearRect(0,0,w,h);

    for(var i = stars.length-1; i>=0; i--){
      var s = stars[i];
      var rad = s.angle * Math.PI/180;

      s.x += s.speed * Math.cos(rad);
      s.y += s.speed * Math.sin(rad);

      var tailX = s.x - s.len * Math.cos(rad);
      var tailY = s.y - s.len * Math.sin(rad);

      var grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, s.starColor);

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();

      if(s.x < -100 || s.x > w+100 || s.y < -100 || s.y > h+100){
        stars.splice(i,1);
      }
    }

    if (!document.hidden) requestAnimationFrame(draw);
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) requestAnimationFrame(draw);
  });
  draw();
})();

(function(){
  if (PREFERS_REDUCED_MOTION) return;
  var canvas = document.getElementById('star-canvas');
  var ctx = canvas.getContext('2d');
  var w, h, stars;

  var STAR_DENSITY = 0.00030;
  var MIN_TWINKLE_SPEED = 1.0;
  var MAX_TWINKLE_SPEED = 1.0;
  var TWINKLE_PROBABILITY = 1.00;

  var lastW = window.innerWidth;
  function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  if (window.innerWidth !== lastW) {
    generateStars();
    lastW = window.innerWidth;
  }
}
window.addEventListener('resize', resize);

  function generateStars(){
    var count = Math.floor(w * h * STAR_DENSITY);
    stars = [];
    for(var i=0; i<count; i++){
      var willTwinkle = Math.random() < TWINKLE_PROBABILITY;
      stars.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*1.3 + 0.4,
        baseAlpha: Math.random()*0.5 + 0.4,
        twinkle: willTwinkle,
        speed: Math.random()*(MAX_TWINKLE_SPEED - MIN_TWINKLE_SPEED) + MIN_TWINKLE_SPEED,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  resize();

  function draw(time){
    ctx.clearRect(0,0,w,h);
    var t = time * 0.001;

    for(var i=0; i<stars.length; i++){
      var s = stars[i];
      var alpha = s.baseAlpha;

      if(s.twinkle){
        alpha = s.baseAlpha * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      }

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!document.hidden) requestAnimationFrame(draw);
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) requestAnimationFrame(draw);
  });
  requestAnimationFrame(draw);
})();
</script>

    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.9 4.45-9.9 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.78 1.22h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.82 14.1c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.11.11-1.79-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.54-1.16-2.94 0-1.4.73-2.08 1-2.37.26-.28.57-.35.76-.35h.55c.18.01.41-.07.64.49.24.57.81 1.98.88 2.13.07.14.11.31.02.5-.09.19-.14.31-.27.48-.14.17-.29.38-.41.51-.14.14-.28.29-.12.57.16.28.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.21 1.37.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.2.5.31.06.11.06.63-.18 1.31z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.53.02C13.84 0 15.14.01 16.44.02c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5v-13zm2.2.5 7.8 5.4L19.8 6H4.2zM20 8.2l-7.4 5.1a1 1 0 0 1-1.2 0L4 8.2V18h16V8.2z"/></svg>',
    default: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.5"/></svg>'
  };

  // Cari pola <tagname> di teks nama sosmed, ga peduli besar/kecil huruf
  function extractSocialTag(text) {
    const m = String(text || '').match(/<\s*([a-z0-9_]+)\s*>/i);
    return m ? m[1].toLowerCase() : null;
  }

  // Buang teks <tag>-nya biar yang tampil ke publik cuma nama bersih
  function stripSocialTag(text) {
    return String(text || '').replace(/<\s*[a-z0-9_]+\s*>/gi, '').trim();
  }

  // Cek apakah item ini WhatsApp (dari tag <whatsapp> atau nama mengandung kata "whatsapp")
  function isWhatsappPlatform(platform) {
    const tag = extractSocialTag(platform);
    if (tag) return tag === 'whatsapp';
    return (platform || '').toLowerCase().includes('whatsapp');
  }

  // Cek apakah teks di kolom URL itu cuma nomor telepon polos (bukan link http/wa.me/dll)
  function isPlainPhoneNumber(text) {
    const t = String(text || '').trim();
    if (!t) return false;
    if (!/^[\d\s\-+().]+$/.test(t)) return false; // ada huruf/karakter lain -> bukan nomor polos
    return t.replace(/[^\d]/g, '').length >= 8;
  }

  // Ubah nomor lokal (08xx / 8xx / 628xx / +628xx) jadi format internasional buat wa.me
  function normalizeWhatsappNumber(text) {
    let digits = String(text || '').replace(/[^\d]/g, '');
    if (digits.startsWith('0')) digits = '62' + digits.slice(1);
    else if (!digits.startsWith('62')) digits = '62' + digits;
    return digits;
  }

  // Kalau item WhatsApp & URL-nya cuma nomor polos, otomatis jadiin link wa.me
  function resolveSocialUrl(item) {
    if (isWhatsappPlatform(item.platform) && isPlainPhoneNumber(item.url)) {
      return 'https://wa.me/' + normalizeWhatsappNumber(item.url);
    }
    return item.url;
  }

  function safeUrl(url) {
    try {
      const u = new URL(String(url), window.location.href);
      const allowed = ['http:', 'https:', 'mailto:', 'tel:', 'whatsapp:'];
      return allowed.includes(u.protocol) ? u.href : '#';
    } catch (err) {
      return '#';
    }
  }

  function getIcon(platform) {
    const tag = extractSocialTag(platform);
    if (tag && iconMap[tag]) return iconMap[tag];
    const key = (platform || '').toLowerCase().trim();
    for (const k in iconMap) {
      if (k !== 'default' && key.includes(k)) return iconMap[k];
    }
    return iconMap.default;
  }

  async function loadPublicData() {
    const { data: buyer, error: buyerError } = await sb
      .from('buyers')
      .select('*')
      .eq('username', BUYER_USERNAME)
      .single();

    if (buyerError || !buyer) {
      document.getElementById('profile-name').textContent = 'Toko tidak ditemukan';
      return;
    }

    document.getElementById('profile-name').textContent = buyer.display_name || '';
    document.getElementById('profile-bio').textContent = buyer.bio || '';
    if (buyer.avatar_url) {
      document.getElementById('profile-avatar').src = buyer.avatar_url + '?v=' + Date.now();
    }

    if (buyer.theme) {
      const root = document.documentElement.style;
      if (buyer.theme.primary) root.setProperty('--cyan', buyer.theme.primary);
      if (buyer.theme.secondary) root.setProperty('--blue', buyer.theme.secondary);
      if (buyer.theme.accent) root.setProperty('--purple', buyer.theme.accent);
    }

    const { data: sections } = await sb
      .from('sections')
      .select('*')
      .eq('buyer_id', buyer.id)
      .order('sort_order');

    const { data: links } = await sb
     .from('links')
     .select('*')
     .eq('buyer_id', buyer.id)
     .order('sort_order')
     .order('id');

    const container = document.getElementById('dynamic-sections');
    container.innerHTML = '';

    (sections || []).forEach(section => {
      const label = document.createElement('div');
      label.className = 'section-label reveal-item';
      label.textContent = section.title;
      container.appendChild(label);

      const sectionLinks = (links || []).filter(l => l.section_id === section.id);
      sectionLinks.forEach(link => {
        const a = document.createElement('a');
        a.href = safeUrl(link.url);
        a.className = 'btn reveal-item';
        a.target = '_blank';
        a.rel = 'noopener';
        const dot = document.createElement('span');
        dot.className = 'dot';
        a.append(dot, document.createTextNode(link.label));
        container.appendChild(a);
      });
    });

    const { data: socials } = await sb
      .from('social_links')
      .select('*')
      .eq('buyer_id', buyer.id);

    const socialContainer = document.getElementById('social-links');
    socialContainer.innerHTML = '';

    (socials || []).forEach(item => {
      const a = document.createElement('a');
      a.href = safeUrl(resolveSocialUrl(item));
      a.className = 'social reveal-item';
      a.setAttribute('aria-label', stripSocialTag(item.platform));
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = getIcon(item.platform);
      socialContainer.appendChild(a);
    });
  }

  loadPublicData().catch(function (err) {
    console.error(err);
    var nameEl = document.getElementById('profile-name');
    if (nameEl) nameEl.textContent = 'Gagal memuat halaman';
    var bioEl = document.getElementById('profile-bio');
    if (bioEl) bioEl.textContent = 'Coba muat ulang halaman ini beberapa saat lagi.';
  }).then(function () {
    try {
      var savedY = sessionStorage.getItem('dummyScrollY');
      if (savedY !== null) {
        requestAnimationFrame(function () {
          window.scrollTo(0, parseInt(savedY, 10) || 0);
        });
      }
    } catch (err) {}

    dataFinished = true;
    tryReveal();
  });
})();
