<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard Buyer</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg1:#04060d;
      --bg2:#0a0f1f;
      --cyan:#22e8ff;
      --blue:#3b6bff;
      --purple:#a259ff;
      --silver:#c9d3e0;
      --glass:rgba(255,255,255,0.045);
      --glass-border:rgba(255,255,255,0.09);
      --danger:#ff6b7a;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    html{scroll-behavior:smooth;}

    a, button, input, textarea, [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 20%, #120B1E 0%, transparent 35%),
        radial-gradient(circle at 85% 10%, #0B1220 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, #070B14 0%, transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color:var(--silver);
      font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      display:flex;
      justify-content:center;
      overflow-x:hidden;
    }

    .wrap{
      width:100%;
      max-width:480px;
      padding:40px 18px 60px;
    }

    /* ===== Brand header ===== */
    .brand-title{
      font-size:22px;
      font-weight:700;
      letter-spacing:0.3px;
      background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-align:center;
    }

    .brand-sub{
      font-size:13px;
      color:#9aa5b8;
      text-align:center;
      margin-top:6px;
      margin-bottom:28px;
    }

    /* ===== Card ===== */
    .card{
      background:var(--glass);
      border:1px solid var(--glass-border);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-radius:18px;
      padding:18px;
      margin-bottom:16px;
    }

    .section-label{
      font-size:11px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      color:#6f7d94;
      margin-bottom:14px;
    }

    /* ===== Fields ===== */
    .field{
      margin-bottom:14px;
    }
    .field:last-child{ margin-bottom:0; }

    .field label{
      display:block;
      font-size:11.5px;
      color:#8b96ab;
      margin-bottom:6px;
      letter-spacing:0.2px;
    }

    input[type="text"],
    input[type="password"],
    textarea{
      width:100%;
      background:rgba(255,255,255,0.035);
      border:1px solid var(--glass-border);
      border-radius:12px;
      padding:12px 14px;
      color:var(--silver);
      font-size:14px;
      font-family:inherit;
      outline:none;
      transition:border-color 0.18s ease, box-shadow 0.18s ease;
    }
    textarea{ resize:none; min-height:70px; }

    input::placeholder, textarea::placeholder{ color:#5c667a; }

    input:focus, textarea:focus{
      border-color:rgba(139,160,255,0.5);
      box-shadow:0 0 0 3px rgba(59,107,255,0.15);
    }

    input[type="file"]{
      width:100%;
      font-size:12.5px;
      color:#9aa5b8;
      margin-bottom:12px;
    }

    .hint{
      font-size:11.5px;
      color:#6f7d94;
      margin-top:8px;
    }

    /* ===== Buttons ===== */
    .btn-primary{
      display:block;
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,var(--cyan),var(--blue),var(--purple));
      color:#04060d;
      font-weight:700;
      font-size:14.5px;
      cursor:pointer;
      box-shadow:0 0 22px rgba(59,107,255,0.3);
      transition:transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-primary:active{ transform:scale(0.98); }

    .btn-secondary{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:11px 16px;
      border-radius:12px;
      background:transparent;
      border:1px solid rgba(139,160,255,0.35);
      color:var(--silver);
      font-size:13.5px;
      font-weight:600;
      cursor:pointer;
      transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .btn-secondary:active{
      transform:scale(1.02);
      box-shadow:0 0 16px rgba(59,107,255,0.25);
      border-color:rgba(139,160,255,0.6);
    }

    .btn-danger-ghost{
      padding:5px 11px;
      border-radius:10px;
      background:transparent;
      border:1px solid rgba(255,107,122,0.35);
      color:var(--danger);
      font-size:11.5px;
      font-weight:600;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn-danger-ghost:active{ background:rgba(255,107,122,0.1); }

    .add-row{

      flex-direction:column;
      gap:10px;
      margin-top:14px;

      flex-direction:column;
      align-items:center;
      margin-bottom:24px;

    .avatar-ring{

      margin-bottom:12px;

      height:100%;
      border-radius:50%;
      object-fit:cover;
      display:block;
      background:#0a0f1f;
    }
    
    /* ===== Avatar edit button ===== */
.avatar-ring{ position:relative; }

    .social-item{

      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border:1px solid var(--glass-border);
      border-radius:12px;
      margin-bottom:8px;
      font-size:13px;

      text-overflow:ellipsis;

    }

    /* ===== Section cards (dynamic) ===== */

      margin-bottom:12px;

      justify-content:space-between;

    .section-card-head b{

      letter-spacing:0.2px;

    .link-chip{

      align-items:center;
      justify-content:space-between;

      padding:8px 10px;
      background:rgba(255,255,255,0.03);
      border-radius:10px;

    }
    .link-chip span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:#c9d3e0;
    }
    .add-row-inline{

      flex-direction:column;
      gap:8px;
      margin-top:10px;

/* ===================================================
   PROFILE PHOTO — pilih WebP, auto-crop lingkaran, upload
   =================================================== */

let avatarEditBtn, avatarInput;

function initAvatarEditor() {
  avatarEditBtn = document.getElementById('avatar-edit-btn');
  avatarInput   = document.getElementById('avatar-input');

  // Pencil -> buka file picker (input tersembunyi)
  avatarEditBtn.addEventListener('click', () => avatarInput.click());

  // File dipilih -> validasi -> langsung crop & upload
  avatarInput.addEventListener('change', onAvatarFileSelected);
}

async function onAvatarFileSelected() {
  const file = avatarInput.files[0];
  if (!file) return;

  const isWebpMime = file.type === 'image/webp';
  const isWebpExt = file.name.toLowerCase().endsWith('.webp');

  if (!isWebpMime || !isWebpExt) {
    document.getElementById('result').textContent =
      'Foto profil harus berformat WebP';
    avatarInput.value = '';
    return;
  }

  document.getElementById('result').textContent = 'Sedang mengunggah...';

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = async () => {
    try {
      const blob = await cropToCircle(img);
      URL.revokeObjectURL(url);
      await uploadAvatarBlob(blob);
    } catch (err) {
      console.error(err);
      document.getElementById('result').textContent =
        'GAGAL UPLOAD: ' + (err && err.message ? err.message : 'terjadi kesalahan');
    } finally {
      avatarInput.value = '';
    }
  };

  img.src = url;
}

// Crop otomatis: ambil bagian tengah (cover) dari foto, jadikan lingkaran
function cropToCircle(img) {
  return new Promise((resolve) => {
    const outputSize = 640; // ukuran output avatar, kualitas tinggi

    // Tentukan area kotak di tengah gambar (sisi terpendek) untuk di-cover
    const shortest = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - shortest) / 2;
    const sy = (img.naturalHeight - shortest) / 2;

    const canvas = document.createElement('canvas');
    canvas.width = outputSize;
    canvas.height = outputSize;
    const ctx = canvas.getContext('2d');

    ctx.save();
    ctx.beginPath();
    ctx.arc(outputSize / 2, outputSize / 2, outputSize / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, sx, sy, shortest, shortest, 0, 0, outputSize, outputSize);
    ctx.restore();

    canvas.toBlob((blob) => resolve(blob), 'image/webp', 0.95);
  });
}

// ---- Upload ke Supabase (logic lama dipertahankan, dibungkus reusable) ----
async function uploadAvatarBlob(blob) {
  const file = new File([blob], 'avatar.webp', { type: 'image/webp' });

  const { data: userData } = await sb.auth.getUser();
  const authUserId = userData.user.id;

  const { data: existingFiles } = await sb.storage
    .from('avatars')
    .list(authUserId);

  if (existingFiles && existingFiles.length > 0) {
    const filesToRemove = existingFiles.map(f => authUserId + '/' + f.name);
    await sb.storage.from('avatars').remove(filesToRemove);
  }

  const filePath = authUserId + '/avatar.webp';

  const { error: uploadError } = await sb.storage
    .from('avatars')
    .upload(filePath, file, { upsert: true });

  if (uploadError) {
    document.getElementById('result').textContent =
      'GAGAL UPLOAD: ' + uploadError.message;
    console.error(uploadError);
    throw uploadError;
  }

  const { data: urlData } = sb.storage
    .from('avatars')
    .getPublicUrl(filePath);

  const publicUrl = urlData.publicUrl;

  const { error: updateError } = await sb
    .from('buyers')
    .update({ avatar_url: publicUrl })
    .eq('id', myBuyerId);

  if (updateError) {
    document.getElementById('result').textContent =
      'GAGAL SIMPAN URL: ' + updateError.message;
    console.error(updateError);
    throw updateError;
  }

  const preview = document.getElementById('avatar-preview');
  preview.src = publicUrl + '?t=' + Date.now();
  preview.style.display = 'block';
  document.getElementById('result').textContent =
    'Foto profil berhasil diperbarui';
}

async function loadSocials() {
  const { data, error } = await sb
    .from('social_links')
    .select('*')
    .eq('buyer_id', myBuyerId);

  if (error) {
    console.error(error);
    return;
  }

  const container = document.getElementById('social-list');
  container.innerHTML = '';

  data.forEach(item => {
    const div = document.createElement('div');
    div.className = 'social-item';
    div.innerHTML = `
      <span><b>${item.platform}:</b> ${item.url}</span>
      <button class="btn-danger-ghost" onclick="deleteSocial('${item.id}')">Hapus</button>
    `;
    container.appendChild(div);
  });
}

async function addSocial() {
  const platform = document.getElementById('new-social-platform').value;
  const url = document.getElementById('new-social-url').value;

  if (!platform || !url) {
    document.getElementById('result').textContent = 'Isi platform & URL dulu';
    return;
  }

  const { error } = await sb
    .from('social_links')
    .insert({ buyer_id: myBuyerId, platform: platform, url: url });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH: ' + error.message;
    return;
  }

  document.getElementById('new-social-platform').value = '';
  document.getElementById('new-social-url').value = '';
  document.getElementById('result').textContent = 'Sosmed ditambahkan!';
  await loadSocials();
}

async function deleteSocial(id) {
  const { error } = await sb
    .from('social_links')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Sosmed dihapus!';
  await loadSocials();
}

window.addSocial = addSocial;
window.deleteSocial = deleteSocial;

async function loadSections() {
  const { data: sectionsData, error: sectionsError } = await sb
    .from('sections')
    .select('*')
    .eq('buyer_id', myBuyerId)
    .order('sort_order');

  if (sectionsError) {
    console.error(sectionsError);
    return;
  }

  const { data: linksData, error: linksError } = await sb
    .from('links')
    .select('*')
    .eq('buyer_id', myBuyerId)
    .order('sort_order');

  if (linksError) {
    console.error(linksError);
    return;
  }

  const container = document.getElementById('sections-list');
  container.innerHTML = '';

  sectionsData.forEach(section => {
    const sectionLinks = linksData.filter(l => l.section_id === section.id);

    const div = document.createElement('div');
    div.className = 'section-card';

    let linksHtml = '';
    sectionLinks.forEach(link => {
      linksHtml += `
        <div class="link-chip">
          <span>${link.label} — ${link.url}</span>
          <button class="btn-danger-ghost" onclick="deleteLink('${link.id}')">Hapus</button>
        </div>
      `;
    });

    div.innerHTML = `
      <div class="section-card-head">
        <b>${section.title}</b>
        <button class="btn-danger-ghost" onclick="deleteSection('${section.id}')">Hapus Section</button>
      </div>
      <div>${linksHtml}</div>
      <div class="add-row-inline">
        <input type="text" id="label-${section.id}" placeholder="Label tombol">
        <input type="text" id="url-${section.id}" placeholder="URL tombol">
        <button class="btn-secondary" onclick="addLink('${section.id}')">Tambah Button</button>
      </div>
    `;

    container.appendChild(div);
  });
}

async function addSection() {
  const title = document.getElementById('new-section-title').value;
  if (!title) {
    document.getElementById('result').textContent = 'Isi nama section dulu';
    return;
  }

  const { count } = await sb
    .from('sections')
    .select('*', { count: 'exact', head: true })
    .eq('buyer_id', myBuyerId);

  const { error } = await sb
    .from('sections')
    .insert({ buyer_id: myBuyerId, title: title, sort_order: count || 0 });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH SECTION: ' + error.message;
    return;
  }

  document.getElementById('new-section-title').value = '';
  document.getElementById('result').textContent = 'Section ditambahkan!';
  await loadSections();
}

async function deleteSection(id) {
  const { error } = await sb
    .from('sections')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS SECTION: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Section dihapus!';
  await loadSections();
}

async function addLink(sectionId) {

  const url = document.getElementById('url-' + sectionId).value;

    return;
  }

  const { count } = await sb
  .from('links')
  .select('*', { count: 'exact', head: true })
  .eq('section_id', sectionId);

  const { error } = await sb
  .from('links')
  .insert({ buyer_id: myBuyerId, section_id: sectionId, label: label, url: url, sort_order: count || 0 });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH BUTTON: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Button ditambahkan!';
  await loadSections();
}

async function deleteLink(id) {
  const { error } = await sb
    .from('links')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS BUTTON: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Button dihapus!';
  await loadSections();
}

window.addSection = addSection;
window.deleteSection = deleteSection;
window.addLink = addLink;
window.deleteLink = deleteLink;
window.loadSections = loadSections;
  </script>
