<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Login Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="login-box">
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="loginBuyer()">Masuk</button>
  </div>

  <div id="dashboard-box" style="display:none;">
  <h3>Dashboard Saya</h3>
  <label>Foto Profil (khusus format WebP):</label><br>
<input type="file" id="avatar-input" accept="image/webp"><br>
<button onclick="uploadAvatar()">Upload Foto</button>
<img id="avatar-preview" style="max-width:100px; display:none;"><br><br>
  <label>Nama Toko:</label><br>
  <input type="text" id="edit-name"><br><br>
  <label>Bio:</label><br>
  <textarea id="edit-bio"></textarea><br><br>
  <hr>
<h4>Link Sosmed</h4>
<div id="social-list"></div>
<input type="text" id="new-social-platform" placeholder="Platform (misal: Instagram)">
<input type="text" id="new-social-url" placeholder="URL link">
<button onclick="addSocial()">Tambah Sosmed</button>
<hr>
<h4>Section & Link</h4>
<div id="sections-list"></div>

<input type="text" id="new-section-title" placeholder="Nama Section Baru (misal: GB STOK)">
<button onclick="addSection()">Tambah Section</button>
  <button onclick="saveMyData()">Simpan Perubahan</button>
</div>

  <pre id="result"></pre>

  <script>
    const sb = window.supabase.createClient(
  'https://cejanyyvtvevihrqaywj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlamFueXl2dHZldmlocnFheXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDgyNTUsImV4cCI6MjEwMTU4NDI1NX0.KQDCpHbc21_ZkEn0gHrpYJ1wlehFGwdlSSA8S5o3qDw'
);

let myBuyerId = null;

async function loginBuyer() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const fakeEmail = username + '@internal.xdear.app';

  const { error } = await sb.auth.signInWithPassword({
    email: fakeEmail,
    password: password
  });

  if (error) {
    document.getElementById('result').textContent =
      'GAGAL LOGIN: ' + error.message;
    return;
  }

  document.getElementById('result').textContent =
    'Login berhasil, mengambil data...';

  await loadMyData();
}

async function loadMyData() {
  const { data: userData } = await sb.auth.getUser();
  const authUserId = userData.user.id;

  const { data, error } = await sb
    .from('buyers')
    .select('*')
    .eq('auth_user_id', authUserId)
    .single();

  if (error) {
    document.getElementById('result').textContent =
      'GAGAL AMBIL DATA: ' + error.message;
    return;
  }

  myBuyerId = data.id;

  document.getElementById('login-box').style.display = 'none';
  document.getElementById('dashboard-box').style.display = 'block';

  document.getElementById('edit-name').value = data.display_name || '';
  document.getElementById('edit-bio').value = data.bio || '';

  await loadSocials();
  await loadSections();

  document.getElementById('result').textContent =
    'Data dimuat, siap diedit';
}

async function saveMyData() {
  const newName = document.getElementById('edit-name').value;
  const newBio = document.getElementById('edit-bio').value;

  const { error } = await sb
    .from('buyers')
    .update({
      display_name: newName,
      bio: newBio
    })
    .eq('id', myBuyerId);

  if (error) {
    document.getElementById('result').textContent =
      'GAGAL SIMPAN: ' + error.message;
    return;
  }

  document.getElementById('result').textContent =
    'Berhasil disimpan!';
}

window.loginBuyer = loginBuyer;
window.loadMyData = loadMyData;
window.saveMyData = saveMyData;

async function uploadAvatar() {
  const fileInput = document.getElementById('avatar-input');
  const file = fileInput.files[0];

  if (!file) {
    document.getElementById('result').textContent = 'Pilih file dulu';
    return;
  }

  // Validasi ketat: hanya format WebP yang boleh diupload.
  // Cek dua-duanya (MIME type dan ekstensi nama file) karena
  // beberapa browser/OS kadang tidak set MIME type dengan benar.
  const isWebpMime = file.type === 'image/webp';
  const isWebpExt = file.name.toLowerCase().endsWith('.webp');

  if (!isWebpMime || !isWebpExt) {
    document.getElementById('result').textContent =
      'GAGAL UPLOAD: File harus format WebP (.webp). Format JPG/JPEG/PNG tidak diperbolehkan.';
    fileInput.value = '';
    return;
  }

  const { data: sessionData } = await sb.auth.getSession();

  const { data: userData } = await sb.auth.getUser();
  const authUserId = userData.user.id;

  // Hapus semua file avatar lama di folder user ini sebelum upload yang baru
  const { data: existingFiles } = await sb.storage
    .from('avatars')
    .list(authUserId);

  if (existingFiles && existingFiles.length > 0) {
    const filesToRemove = existingFiles.map(f => authUserId + '/' + f.name);
    await sb.storage.from('avatars').remove(filesToRemove);
  }

  const filePath = authUserId + '/avatar.webp';

  const { error: uploadError } = await sb.storage
    .from('avatars')
    .upload(filePath, file, { upsert: true });

  if (uploadError) {
    document.getElementById('result').textContent =
      'GAGAL UPLOAD: ' + uploadError.message;
    console.error(uploadError);
    return;
  }

  const { data: urlData } = sb.storage
    .from('avatars')
    .getPublicUrl(filePath);

  const publicUrl = urlData.publicUrl;

  const { error: updateError } = await sb
    .from('buyers')
    .update({
      avatar_url: publicUrl
    })
    .eq('id', myBuyerId);

  if (updateError) {
    document.getElementById('result').textContent =
      'GAGAL SIMPAN URL: ' + updateError.message;
    console.error(updateError);
    return;
  }

  document.getElementById('avatar-preview').src = publicUrl;
  document.getElementById('avatar-preview').style.display = 'block';
  document.getElementById('result').textContent =
    'Foto berhasil diupload & disimpan!';
}

async function loadSocials() {
  const { data, error } = await sb
    .from('social_links')
    .select('*')
    .eq('buyer_id', myBuyerId);

  if (error) {
    console.error(error);
    return;
  }

  const container = document.getElementById('social-list');
  container.innerHTML = '';

  data.forEach(item => {
    const div = document.createElement('div');
    div.innerHTML = `
      <span>${item.platform}: ${item.url}</span>
      <button onclick="deleteSocial('${item.id}')">Hapus</button>
    `;
    container.appendChild(div);
  });
}

async function addSocial() {
  const platform = document.getElementById('new-social-platform').value;
  const url = document.getElementById('new-social-url').value;

  if (!platform || !url) {
    document.getElementById('result').textContent = 'Isi platform & URL dulu';
    return;
  }

  const { error } = await sb
    .from('social_links')
    .insert({ buyer_id: myBuyerId, platform: platform, url: url });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH: ' + error.message;
    return;
  }

  document.getElementById('new-social-platform').value = '';
  document.getElementById('new-social-url').value = '';
  document.getElementById('result').textContent = 'Sosmed ditambahkan!';
  await loadSocials();
}

async function deleteSocial(id) {
  const { error } = await sb
    .from('social_links')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Sosmed dihapus!';
  await loadSocials();
}

window.addSocial = addSocial;
window.deleteSocial = deleteSocial;

async function loadSections() {
  const { data: sectionsData, error: sectionsError } = await sb
    .from('sections')
    .select('*')
    .eq('buyer_id', myBuyerId)
    .order('sort_order');

  if (sectionsError) {
    console.error(sectionsError);
    return;
  }

  const { data: linksData, error: linksError } = await sb
    .from('links')
    .select('*')
    .eq('buyer_id', myBuyerId)
    .order('sort_order');

  if (linksError) {
    console.error(linksError);
    return;
  }

  const container = document.getElementById('sections-list');
  container.innerHTML = '';

  sectionsData.forEach(section => {
    const sectionLinks = linksData.filter(l => l.section_id === section.id);

    const div = document.createElement('div');
    div.style.border = '1px solid #ccc';
    div.style.padding = '8px';
    div.style.marginBottom = '8px';

    let linksHtml = '';
    sectionLinks.forEach(link => {
      linksHtml += `
        <div>
          - ${link.label} (${link.url})
          <button onclick="deleteLink('${link.id}')">Hapus</button>
        </div>
      `;
    });

    div.innerHTML = `
      <b>${section.title}</b>
      <button onclick="deleteSection('${section.id}')">Hapus Section</button>
      <div>${linksHtml}</div>
      <input type="text" id="label-${section.id}" placeholder="Label tombol">
      <input type="text" id="url-${section.id}" placeholder="URL tombol">
      <button onclick="addLink('${section.id}')">Tambah Button</button>
    `;

    container.appendChild(div);
  });
}

async function addSection() {
  const title = document.getElementById('new-section-title').value;
  if (!title) {
    document.getElementById('result').textContent = 'Isi nama section dulu';
    return;
  }

  const { count } = await sb
    .from('sections')
    .select('*', { count: 'exact', head: true })
    .eq('buyer_id', myBuyerId);

  const { error } = await sb
    .from('sections')
    .insert({ buyer_id: myBuyerId, title: title, sort_order: count || 0 });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH SECTION: ' + error.message;
    return;
  }

  document.getElementById('new-section-title').value = '';
  document.getElementById('result').textContent = 'Section ditambahkan!';
  await loadSections();
}

async function deleteSection(id) {
  const { error } = await sb
    .from('sections')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS SECTION: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Section dihapus!';
  await loadSections();
}

async function addLink(sectionId) {
  const label = document.getElementById('label-' + sectionId).value;
  const url = document.getElementById('url-' + sectionId).value;

  if (!label || !url) {
    document.getElementById('result').textContent = 'Isi label & URL dulu';
    return;
  }

  const { count } = await sb
  .from('links')
  .select('*', { count: 'exact', head: true })
  .eq('section_id', sectionId);

  const { error } = await sb
  .from('links')
  .insert({ buyer_id: myBuyerId, section_id: sectionId, label: label, url: url, sort_order: count || 0 });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH BUTTON: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Button ditambahkan!';
  await loadSections();
}

async function deleteLink(id) {
  const { error } = await sb
    .from('links')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS BUTTON: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Button dihapus!';
  await loadSections();
}

window.addSection = addSection;
window.deleteSection = deleteSection;
window.addLink = addLink;
window.deleteLink = deleteLink;
window.loadSections = loadSections;
  </script>

</body>
</html>
