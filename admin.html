    /* ===== Card ===== */
    .card{

      border:1px solid var(--glass-border);

      display:block;
      font-size:11.5px;
      color:#8b96ab;

      letter-spacing:0.2px;
    }

    input[type="text"],

/* ===================================================
   PROFILE PHOTO — pilih WebP, auto-crop lingkaran, upload
   =================================================== */

let avatarEditBtn, avatarInput;

function initAvatarEditor() {
  avatarEditBtn = document.getElementById('avatar-edit-btn');
  avatarInput   = document.getElementById('avatar-input');

  // Pencil -> buka file picker (input tersembunyi)
  avatarEditBtn.addEventListener('click', () => avatarInput.click());

  // File dipilih -> validasi -> langsung crop & upload
  avatarInput.addEventListener('change', onAvatarFileSelected);
}

async function onAvatarFileSelected() {
  const file = avatarInput.files[0];
  if (!file) return;

  const isWebpMime = file.type === 'image/webp';
  const isWebpExt = file.name.toLowerCase().endsWith('.webp');

  if (!isWebpMime || !isWebpExt) {
    document.getElementById('result').textContent =
      'Foto profil harus berformat WebP';
    avatarInput.value = '';
    return;
  }

  document.getElementById('result').textContent = 'Sedang mengunggah...';

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = async () => {
    try {
      const blob = await cropToCircle(img);
      URL.revokeObjectURL(url);
      await uploadAvatarBlob(blob);
    } catch (err) {
      console.error(err);
      document.getElementById('result').textContent =
        'GAGAL UPLOAD: ' + (err && err.message ? err.message : 'terjadi kesalahan');
    } finally {
      avatarInput.value = '';
    }
  };

  img.src = url;
}

// Crop otomatis: ambil bagian tengah (cover) dari foto, jadikan lingkaran
function cropToCircle(img) {
  return new Promise((resolve) => {
    const outputSize = 640; // ukuran output avatar, kualitas tinggi

    // Tentukan area kotak di tengah gambar (sisi terpendek) untuk di-cover
    const shortest = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - shortest) / 2;
    const sy = (img.naturalHeight - shortest) / 2;

    const canvas = document.createElement('canvas');
    canvas.width = outputSize;
    canvas.height = outputSize;
    const ctx = canvas.getContext('2d');

    ctx.save();
    ctx.beginPath();
    ctx.arc(outputSize / 2, outputSize / 2, outputSize / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, sx, sy, shortest, shortest, 0, 0, outputSize, outputSize);
    ctx.restore();

    canvas.toBlob((blob) => resolve(blob), 'image/webp', 0.95);
  });
}

// ---- Upload ke Supabase (logic lama dipertahankan, dibungkus reusable) ----
async function uploadAvatarBlob(blob) {
  const file = new File([blob], 'avatar.webp', { type: 'image/webp' });

  const { data: userData } = await sb.auth.getUser();
  const authUserId = userData.user.id;

  const { data: existingFiles } = await sb.storage
    .from('avatars')
    .list(authUserId);

  if (existingFiles && existingFiles.length > 0) {
    const filesToRemove = existingFiles.map(f => authUserId + '/' + f.name);
    await sb.storage.from('avatars').remove(filesToRemove);
  }

  const filePath = authUserId + '/avatar.webp';

  const { error: uploadError } = await sb.storage
    .from('avatars')
    .upload(filePath, file, { upsert: true });

  if (uploadError) {
    document.getElementById('result').textContent =
      'GAGAL UPLOAD: ' + uploadError.message;
    console.error(uploadError);
    throw uploadError;
  }

  const { data: urlData } = sb.storage
    .from('avatars')
    .getPublicUrl(filePath);

  const publicUrl = urlData.publicUrl;

  const { error: updateError } = await sb
    .from('buyers')
    .update({ avatar_url: publicUrl })
    .eq('id', myBuyerId);

  if (updateError) {
    document.getElementById('result').textContent =
      'GAGAL SIMPAN URL: ' + updateError.message;
    console.error(updateError);
    throw updateError;
  }

  const preview = document.getElementById('avatar-preview');
  preview.src = publicUrl + '?t=' + Date.now();
  preview.style.display = 'block';
  document.getElementById('result').textContent =
    'Foto profil berhasil diperbarui';
}

async function loadSocials() {
  const { data, error } = await sb
    .from('social_links')

  if (error) {

    return;

  container.innerHTML = '';

  data.forEach(item => {

      <button class="btn-danger-ghost" onclick="deleteSocial('${item.id}')">Hapus</button>
    `;
    container.appendChild(div);
  });
}

const PENCIL_SVG = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 20h9" stroke="#9aa5b8" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="#9aa5b8" stroke-width="2" stroke-linejoin="round"/></svg>`;

const ARROW_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function loadSections() {
  const { data: sectionsData, error: sectionsError } = await sb
    .from('sections')
    .select('*')
    .eq('buyer_id', myBuyerId)
    .order('sort_order');

  if (sectionsError) { console.error(sectionsError); return; }

  const { data: linksData, error: linksError } = await sb
    .from('links')
    .select('*')
    .eq('buyer_id', myBuyerId)
    .order('sort_order');

  if (linksError) { console.error(linksError); return; }

  const container = document.getElementById('sections-list');
  container.innerHTML = '';

  sectionsData.forEach(section => {
    const sectionLinks = linksData.filter(l => l.section_id === section.id);

    let linksHtml = '';
    // numpuk di ATAS: yang paling baru ditambahkan (sort_order terbesar) tampil paling atas
    sectionLinks.slice().reverse().forEach(link => {
      const safeLabel = escapeHtml(link.label);
      const safeUrl = escapeHtml(link.url);
      linksHtml += `
        <div class="link-item">
          <div class="link-name-box" ondblclick="toggleUrlBox('${link.id}')">
            <span class="link-name-text" id="name-text-${link.id}">${safeLabel}</span>
            <input type="text" class="link-edit-input" id="name-edit-${link.id}" style="display:none;">
            <button class="btn-danger-ghost" style="padding:3px 8px;font-size:10.5px;" onclick="event.stopPropagation(); deleteLink('${link.id}')" ondblclick="event.stopPropagation();">Hapus</button>
            <button class="pencil-btn" onclick="event.stopPropagation(); startEditName('${link.id}')" ondblclick="event.stopPropagation();" aria-label="Edit nama">${PENCIL_SVG}</button>
          </div>
          <div class="link-url-box" id="url-box-${link.id}">
            <span class="link-url-text" id="url-text-${link.id}">${safeUrl}</span>
            <input type="text" class="link-edit-input" id="url-edit-${link.id}" style="display:none;">
            <button class="pencil-btn" onclick="event.stopPropagation(); startEditUrl('${link.id}')" ondblclick="event.stopPropagation();" aria-label="Edit url">${PENCIL_SVG}</button>
          </div>
        </div>
      `;
    });

    const div = document.createElement('div');
    div.className = 'section-card';
    div.innerHTML = `
      <div class="section-card-head">
        <b>${escapeHtml(section.title)}</b>
        <button class="btn-danger-ghost" onclick="deleteSection('${section.id}')">Hapus Section</button>
      </div>
      <div>${linksHtml}</div>
      <div class="add-link-group">
        <div class="link-input-box" id="input-box-${section.id}" data-mode="name">
          <div class="link-input-track">
            <input type="text" class="link-input-field active-field" id="new-link-name-${section.id}" placeholder="Nama tombol">
            <input type="text" class="link-input-field" id="new-link-url-${section.id}" placeholder="URL tombol" style="display:none;">
          </div>
          <button class="arrow-btn" onclick="advanceLinkInput('${section.id}')" aria-label="Lanjut isi URL">${ARROW_SVG}</button>
        </div>
        <button class="link-submit-box" onclick="submitNewLink('${section.id}')">
          <span>Tambah Link</span>
          ${ARROW_SVG}
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}

function toggleUrlBox(linkId) {
  document.getElementById('url-box-' + linkId).classList.toggle('open');
}

function startEditName(linkId) {
  const textEl = document.getElementById('name-text-' + linkId);
  const inputEl = document.getElementById('name-edit-' + linkId);
  inputEl.value = textEl.textContent;
  textEl.style.display = 'none';
  inputEl.style.display = 'block';
  inputEl.focus();
  inputEl.select();

  const commit = async () => {
    const newVal = inputEl.value.trim();
    if (newVal && newVal !== textEl.textContent) {
      const { error } = await sb.from('links').update({ label: newVal }).eq('id', linkId);
      if (error) {
        document.getElementById('result').textContent = 'GAGAL SIMPAN NAMA: ' + error.message;
      } else {
        textEl.textContent = newVal;
        document.getElementById('result').textContent = 'Nama link diperbarui!';
      }
    }
    inputEl.style.display = 'none';
    textEl.style.display = '';
  };

  const cancel = () => {
    inputEl.style.display = 'none';
    textEl.style.display = '';
  };

  inputEl.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); inputEl.onblur = null; commit(); }
    if (e.key === 'Escape') { e.preventDefault(); inputEl.onblur = null; cancel(); }
  };
  inputEl.onblur = () => cancel();
}

function startEditUrl(linkId) {
  const textEl = document.getElementById('url-text-' + linkId);
  const inputEl = document.getElementById('url-edit-' + linkId);
  inputEl.value = textEl.textContent;
  textEl.style.display = 'none';
  inputEl.style.display = 'block';
  inputEl.focus();
  inputEl.select();

  const commit = async () => {
    const newVal = inputEl.value.trim();
    if (newVal && newVal !== textEl.textContent) {
      const { error } = await sb.from('links').update({ url: newVal }).eq('id', linkId);
      if (error) {
        document.getElementById('result').textContent = 'GAGAL SIMPAN URL: ' + error.message;
      } else {
        textEl.textContent = newVal;
        document.getElementById('result').textContent = 'URL link diperbarui!';
      }
    }
    inputEl.style.display = 'none';
    textEl.style.display = '';
  };

  const cancel = () => {
    inputEl.style.display = 'none';
    textEl.style.display = '';
  };

  inputEl.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); inputEl.onblur = null; commit(); }
    if (e.key === 'Escape') { e.preventDefault(); inputEl.onblur = null; cancel(); }
  };
  inputEl.onblur = () => cancel();
}

function advanceLinkInput(sectionId) {
  const box = document.getElementById('input-box-' + sectionId);
  if (box.dataset.mode === 'url') return;

  const nameField = document.getElementById('new-link-name-' + sectionId);
  const urlField = document.getElementById('new-link-url-' + sectionId);

  if (!nameField.value.trim()) {
    document.getElementById('result').textContent = 'Isi nama tombol dulu';
    nameField.focus();
    return;
  }

  nameField.classList.remove('active-field');
  nameField.classList.add('slide-out-up');

  urlField.style.display = 'block';
  urlField.classList.add('slide-in-from-bottom');
  void urlField.offsetWidth; // force reflow

  requestAnimationFrame(() => {
    urlField.classList.remove('slide-in-from-bottom');
    urlField.classList.add('active-field');
  });

  setTimeout(() => { nameField.style.display = 'none'; }, 300);

  box.dataset.mode = 'url';
  urlField.focus();
}

async function submitNewLink(sectionId) {
  const nameField = document.getElementById('new-link-name-' + sectionId);
  const urlField = document.getElementById('new-link-url-' + sectionId);
  const label = nameField.value.trim();
  const url = urlField.value.trim();

  if (!label || !url) {
    document.getElementById('result').textContent = 'Isi nama & URL dulu';
    return;
  }

  const { count } = await sb
    .from('links')
    .select('*', { count: 'exact', head: true })
    .eq('section_id', sectionId);

  const { error } = await sb
    .from('links')
    .insert({ buyer_id: myBuyerId, section_id: sectionId, label: label, url: url, sort_order: count || 0 });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH BUTTON: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Button ditambahkan!';
  await loadSections();
}

window.toggleUrlBox = toggleUrlBox;
window.startEditName = startEditName;
window.startEditUrl = startEditUrl;
window.advanceLinkInput = advanceLinkInput;
window.submitNewLink = submitNewLink;

async function addSection() {
  const title = document.getElementById('new-section-title').value;
  if (!title) {
    document.getElementById('result').textContent = 'Isi nama section dulu';
    return;
  }

  const { count } = await sb
    .from('sections')
    .select('*', { count: 'exact', head: true })
    .eq('buyer_id', myBuyerId);

  const { error } = await sb
    .from('sections')
    .insert({ buyer_id: myBuyerId, title: title, sort_order: count || 0 });

  if (error) {
    document.getElementById('result').textContent = 'GAGAL TAMBAH SECTION: ' + error.message;
    return;
  }

  document.getElementById('new-section-title').value = '';
  document.getElementById('result').textContent = 'Section ditambahkan!';
  await loadSections();
}

  const { error } = await sb
    .from('sections')
    .delete()

    document.getElementById('result').textContent = 'GAGAL HAPUS SECTION: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Section dihapus!';

}

async function deleteLink(id) {
  const { error } = await sb
    .from('links')
    .delete()
    .eq('id', id);

  if (error) {
    document.getElementById('result').textContent = 'GAGAL HAPUS BUTTON: ' + error.message;
    return;
  }

  document.getElementById('result').textContent = 'Button dihapus!';
  await loadSections();
}

window.addSection = addSection;
window.deleteSection = deleteSection;
window.deleteLink = deleteLink;
window.loadSections = loadSections;
